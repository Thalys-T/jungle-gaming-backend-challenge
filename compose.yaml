x-app: &app
  build: .
  environment: &env
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: jungle
    DB_PASSWORD: jungle_local
    DB_NAME: jungle_wagering
    SQS_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_local
      POSTGRES_DB: jungle_wagering
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 3s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.10
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: dynamic
      PERSISTENCE: 1
    ports: ["127.0.0.1:4566:4566"]
    volumes: ["localstack_data:/var/lib/localstack"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    build: .
    environment: *env
    command: ["bun", "scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
  app1:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
  app2:
    <<: *app
    ports: ["127.0.0.1:3001:3000"]
  app3:
    <<: *app
    ports: ["127.0.0.1:3002:3000"]
volumes:
  postgres_data:
  localstack_data:
